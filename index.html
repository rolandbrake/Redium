<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Redium</title>
    <style>
      /* the one hand-written stylesheet in the whole project: page reset only */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        overflow-x: hidden;
        font-family:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .redium-badge {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 1000;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px 8px 8px;
        border: 1px solid rgba(15, 23, 42, 0.12);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.16);
        color: #0f172a;
        font:
          600 12px/1 system-ui,
          sans-serif;
        letter-spacing: 0.01em;
        pointer-events: none;
        backdrop-filter: blur(8px);
      }

      .redium-badge img {
        width: 28px;
        height: 28px;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <!-- Vite transforms the TypeScript example and aliases redium to src during development. -->
    <!-- The library mounts itself into document.body - see the selected example. -->
    <script type="module" src="/example/store.ts"></script>
    <!-- The library is bundled into redium.js and aliased to redium during development. -->

    <!-- The badge is not part of the library, but a convenience for users to know what they are using. -->
    <div class="redium-badge" aria-label="Powered by Redium">
      <img src="./redium.png" alt="Redium" />
      <span>Powered by Redium</span>
    </div>
  </body>
</html>
